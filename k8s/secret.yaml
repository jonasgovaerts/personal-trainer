apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: personal-trainer
type: Opaque
stringData:
  GEMINI_API_KEY: "your_api_key_here"
  OIDC_CLIENT_ID: "changeme"
  OIDC_CLIENT_SECRET: "changeme"
  # Must be a long random string (>= 32 bytes) used to sign/encrypt session cookies.
  SESSION_SECRET: "changeme-generate-a-long-random-value"
  # MinIO/S3 credentials for progress photos (optional feature).
  S3_ACCESS_KEY: "changeme"
  S3_SECRET_KEY: "changeme"
