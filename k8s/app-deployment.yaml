apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-trainer-app
  namespace: personal-trainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-trainer
  template:
    metadata:
      labels:
        app: personal-trainer
    spec:
      containers:
        - name: app
          image: ghcr.io/USER/personal-trainer:latest # Replace USER with actual GitHub username
          env:
            - name: DB_HOST
              value: "postgres" # References the Postgres service name
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres" # In production, use secrets
            - name: DB_NAME
              value: "personal_trainer"
            - name: DB_PORT
              value: "5432"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: GEMINI_API_KEY
            # OIDC (Authentik) configuration
            - name: OIDC_ISSUER
              value: "https://authentik.jonasg.be/application/o/personal-trainer/"
            - name: OIDC_REDIRECT_URL
              value: "https://personal-trainer.jonasg.be/auth/callback"
            - name: APP_BASE_URL
              value: "https://personal-trainer.jonasg.be"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: OIDC_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SESSION_SECRET
          ports:
            - containerPort: 8080
