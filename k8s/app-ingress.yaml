apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: personal-trainer
  namespace: personal-trainer
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    external-dns.alpha.kubernetes.io/hostname: personal-trainer.homelab.jonasg.be
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: personal-trainer-authentik-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: personal-trainer.homelab.jonasg.be
    http:
      paths:
      - backend:
          service:
            name: personal-trainer-service
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: personal-trainer.jonasg.be
    http:
      paths:
      - backend:
          service:
            name: personal-trainer-service
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - personal-trainer.homelab.jonasg.be
    - personal-trainer.jonasg.be
    secretName: personal-trainer-tls
